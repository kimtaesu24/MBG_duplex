# Personaplex MBG — VapGPT Backchannel + Face Generation (end-to-end)
#
# Face module: CausalSoftVQContinuousTransformer trained on AMI+DualTalk.
# Training uses teacher-forcing; inference uses autoregressive streaming.
# Inputs to the face module:
#   - audio_feat: Mimi latent features decoded from agent audio tokens [B, T, 512] @ 12.5 fps
#   - llm_feat:   Main transformer embedding z [B, T, 4096] @ 12.5 fps
# Both are internally upsampled 2x inside the face module to match 25 fps face output.
#
# 실행: torchrun --nproc_per_node=<N_GPUS> train.py config/ami_vap_gpt_voice_face.yaml



# check
run_dir: ./output/example_0813_switch
overwrite_run_dir: true

wandb:
  project: "personaplex_finetune_AAAI"
  run_name: "test_run_0813_switch"

# ── 데이터 설정 ─────────────────────────────────────────────────────────────
data:
  train_data: ./data/stereo_ami_balanced_train/data_with_voice_sample_amplified.jsonl
  # train_data: ./data/dualtalk/train/data.jsonl
  shuffle: true
  eval_data: ./data/stereo_ami_balanced_valid/data_with_voice_sample_amplified.jsonl
  # eval_data: ./data/dualtalk/test/data.jsonl
  vap_manifest: /home2/s20235100/Conversational-AI/vap_dataset/manifest.json

# ── Personaplex 모델 경로 ────────────────────────────────────────────────
moshi_paths:
  hf_repo_id: nvidia/personaplex-7b-v1

# ── 학습 설정 ─────────────────────────────────────────────────────────────
max_steps: 2000
batch_size: 4
num_microbatches: 32
duration_sec: 10

# Full finetuning (LM + VapGPT + FaceModule 전체 학습)
lora:
  enable: true
  rank: 64
  scaling: 2.0
full_finetuning: false
freeze_depformer: true

param_dtype: bfloat16
gradient_checkpointing: true

# ── 로깅 / 체크포인트 / 평가 ─────────────────────────────────────────────
log_freq: 5
do_ckpt: true
ckpt_freq: 50
num_ckpt_keep: 10
save_adapters: true
do_eval: true
eval_freq: 50
ckpt_keep_best_metric: epad_f1   # epad_recall / epad_precision / epad_acc 도 가능
ckpt_keep_best_n: 10


# ── 옵티마이저 ────────────────────────────────────────────────────────────
optim:
  lr: 2.0e-5
  weight_decay: 0.1
  pct_start: 0.05

# ── 손실 가중치 ───────────────────────────────────────────────────────────
text_padding_weight: 0.5   # PAD 토큰 손실 가중치 (낮을수록 PAD에 집중 감소)
epad_weight: 2.0            # EPAD 토큰 손실 가중치 (PAD run 끝 전환 지점 강조)
first_codebook_weight_multiplier: 1.0

# ── 텍스트 프롬프트 (에이전트 지시문) ────────────────────────────────────
# inference의 lm_gen.text_prompt_tokens 와 동일한 문자열을 설정합니다.
# 빈 문자열("")이면 프롬프트 없이 학습합니다.
# text_prompt: "<system> [Attentive Mode] You are an attentive and supportive listener. You specialize in active listening, providing calm and consistent backchannels to support the speaker's flow without leading the conversation. <system>"
text_prompt: "<system> [Casual Mode] You are a warm and reactive partner. You talk like a close friend, using enthusiastic backchannels and contributing small talk to keep the mood light and fun. <system>"

# ── Backchannel VAP (VapGPT, LM 내부) ────────────────────────────────────
backchannel:
  enable: true
  module_type: vap_gpt
  pad_token_id: 3
  epad_token_id: 0

  vap_loss_weight: 0.5
  bc_event_loss_weight: 1.0
  vad_loss_weight: 0.3
  commitment_loss_weight: 0.0
  silence_loss_weight: 0.0
  bc_focal_gamma: 2.0
  bc_focal_pos_weight: 15.0
  bc_warmup_steps: 200
  bc_la_tau: 0.75

  # ── Learnable START-vs-rest EPAD fusion ───────────────────────────────
  fusion_trainable: true
  fusion_bc_init: 0.0
  fusion_vap_init: 0.0
  fusion_vad_init: 0.0
  fusion_bias_init: 0.0
  fusion_lr: 0.001

  # ── BC head가 무엇을 "backchannel"로 학습할지 ──────────────────────────
  #   epad : GT 텍스트의 [EPAD] 토큰 = 데이터셋 에이전트가 실제로 낸 반응
  #   vap  : VAP manifest turn-taking = 반응해도 되는 자리 (텍스트 라벨 불필요)
  # 두 모드 모두 같은 3-class head를 쓰므로 그대로 바꿔가며 비교 가능.
  # 모드 비교는 wandb의 bc_head_f1 (BC head 자체 성능) 으로 보세요.
  # epad_f1은 텍스트 head 지표라 모드와 무관하게 계산됩니다.
  bc_target_mode: vap          # epad | vap
  bc_vap_horizon_bins: 1        # vap 모드: 미래 몇 bin까지 "곧 발화"로 볼지 (1=200ms, 2=600ms, 3=1.2s, 4=2.0s)
  bc_vap_require_user_silent: false   # vap 모드: 같은 구간에 유저가 침묵일 때만 positive

  vap_gpt_repo_path: /home2/s20235100/Conversational-AI/VoiceActivityProjection
  vap_gpt_checkpoint: /home2/s20235100/Conversational-AI/VoiceActivityProjection/example/VAP_3mmz3t0u_50Hz_ad20s_134-epoch9-val_2.56.pt
  vap_gpt_dim: 256
  vap_gpt_channel_layers: 1
  vap_gpt_cross_layers: 3
  vap_gpt_num_heads: 4
  vap_gpt_dropout: 0.1
  use_silence_ctx_proj: false

# ── Face Generation Module ────────────────────────────────────────────────
# CausalSoftVQContinuousTransformer — end-to-end trained alongside the LM.
# Training: teacher-forced (gt 3DMM shifted by 1 frame as prev_motion input).
# Inference: autoregressive streaming via model.generate().
face_gen:
  enable: false
