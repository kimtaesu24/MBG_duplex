# ─────────────────────────────────────────────────────────────────────────
# Ablation exp1 — Backbone finetuning ONLY (no VAP module, no Face module).
# Bottom-up baseline: best checkpoint selected by eval text_loss.
#
# 실행: bash run_exp1_backbone.sh
#   (torchrun --nproc_per_node=1 train.py config/exp1_backbone_only.yaml)
# ─────────────────────────────────────────────────────────────────────────

run_dir: ./output/exp1_backbone_only
overwrite_run_dir: true

wandb:
  project: "personaplex_finetune_AAAI"
  run_name: "exp1_backbone_only"

# ── 데이터 ────────────────────────────────────────────────────────────────
data:
  train_data: ./data/stereo_ami_balanced_train/data_with_voice_sample.jsonl
  shuffle: true
  eval_data: ./data/stereo_ami_balanced_valid/data_with_voice_sample.jsonl
  vap_manifest: /home2/s20235100/Conversational-AI/vap_dataset/manifest.json

# ── Personaplex 모델 경로 ────────────────────────────────────────────────
moshi_paths:
  hf_repo_id: nvidia/personaplex-7b-v1

# ── 학습 설정 (single GPU) ───────────────────────────────────────────────
max_steps: 2000
batch_size: 2
num_microbatches: 64
duration_sec: 10

lora:
  enable: true
  rank: 64
  scaling: 2.0
full_finetuning: false
freeze_depformer: false

param_dtype: bfloat16
gradient_checkpointing: true

# ── 로깅 / 체크포인트 / 평가 ─────────────────────────────────────────────
log_freq: 10
do_ckpt: true
ckpt_freq: 100
num_ckpt_keep: 3
save_adapters: true
do_eval: true
eval_freq: 100
# exp1: best checkpoint 는 eval text_loss (lower = better) 기준으로 선별.
ckpt_keep_best_metric: text_loss
ckpt_keep_best_n: 3

# ── 옵티마이저 ────────────────────────────────────────────────────────────
optim:
  lr: 1.0e-5
  weight_decay: 0.1
  pct_start: 0.05

# ── 손실 가중치 ───────────────────────────────────────────────────────────
text_padding_weight: 0.5
epad_weight: 2.0
first_codebook_weight_multiplier: 1.0

# ── 텍스트 프롬프트 ───────────────────────────────────────────────────────
text_prompt: "<system> [Attentive Mode] You are an attentive and supportive listener. You specialize in active listening, providing calm and consistent backchannels to support the speaker's flow without leading the conversation. <system>"

# ── VAP / Face 모듈 비활성 (backbone only) ───────────────────────────────
backchannel:
  enable: false

face_gen:
  enable: false
